<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1 class="title">Калькулятор</h1>
        <div class="operators">
            <input class="num1" type="text">
            <select class="operator">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
              </select>
              <input class="num2" type="text">
        </div>
        <div class="btn_container">
            <button class="clean">Очистити</button>
            <button class="btn">Порахувати</button>
        </div>
        <p class="result"></p>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
